<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Route Agent Test</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff;
            color: #222;
        }

        h1 {
            margin-bottom: 20px;
        }


        /* =========================================================
           CHAT
           ========================================================= */

        #chat {
            border: 1px solid #ddd;
            border-radius: 14px;
            padding: 18px;
            height: 600px;
            overflow-y: auto;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .message {
            margin: 12px 0;
            padding: 12px 15px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user {
            background: #e8f0fe;
            margin-left: auto;
        }

        .agent {
            margin-right: auto;
            padding: 0;
            max-width: 100%;
            background: transparent;
        }


        /* =========================================================
           THINKING BUBBLE
           ========================================================= */

        .thinking {
            background: #f1f1f1;
            margin-right: auto;

            display: flex;
            align-items: center;
            gap: 8px;

            width: fit-content;
            max-width: 80%;

            color: #555;
        }

        .thinking-text {
            font-size: 14px;
        }

        .dots {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;

            background: #777;
            border-radius: 50%;

            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(1) {
            animation-delay: 0s;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.5;
            }

            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }


        /* =========================================================
           TRIP HEADER
           ========================================================= */

        .trip-card {
            background: #ffffff;

            border: 1px solid #ddd;
            border-radius: 16px;

            padding: 20px;
            margin-bottom: 20px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .trip-label {
            font-size: 13px;
            font-weight: bold;

            letter-spacing: 1px;

            color: #777;

            margin-bottom: 8px;
        }

        .trip-route {
            font-size: 22px;
            font-weight: bold;

            margin-bottom: 10px;
        }

        .trip-summary {
            color: #666;
            font-size: 14px;

            margin-bottom: 15px;
        }


        /* =========================================================
           GOOGLE MAPS BUTTON
           ========================================================= */

        .maps-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            padding: 8px 12px;

            border-radius: 8px;

            background: #eeeeee;
            color: #222;

            text-decoration: none;

            font-size: 13px;
            font-weight: 600;

            border: 1px solid #ddd;

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }

        .maps-button:hover {
            background: #dddddd;
        }

        .maps-button:active {
            transform: scale(0.98);
        }

        .route-maps-button {
            margin-top: 2px;
        }


        /* =========================================================
           DAY CARD
           ========================================================= */

        .day-card {
            background: #ffffff;

            border: 1px solid #ddd;
            border-radius: 16px;

            padding: 18px;
            margin-bottom: 18px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .day-header {
            margin-bottom: 18px;
        }

        .day-number {
            font-size: 13px;
            font-weight: bold;

            letter-spacing: 1px;

            color: #777;

            margin-bottom: 5px;
        }

        .day-route {
            font-size: 19px;
            font-weight: bold;
        }

        .day-meta {
            margin-top: 6px;

            font-size: 14px;

            color: #666;
        }


        /* =========================================================
           ROUTE TIMELINE
           ========================================================= */

        .timeline {
            position: relative;

            margin-left: 8px;

            padding-left: 30px;
        }

        .timeline::before {
            content: "";

            position: absolute;

            left: 8px;

            top: 10px;
            bottom: 10px;

            width: 2px;

            background: #d6d6d6;
        }


        /* =========================================================
           STOP
           ========================================================= */

        .stop {
            position: relative;

            margin-bottom: 16px;
        }

        .stop:last-child {
            margin-bottom: 0;
        }

        .stop-dot {
            position: absolute;

            left: -30px;
            top: 17px;

            width: 16px;
            height: 16px;

            border-radius: 50%;

            background: #ffffff;

            border: 3px solid #777;

            z-index: 2;
        }

        .stop-card {
            border: 1px solid #e2e2e2;

            border-radius: 12px;

            padding: 13px 15px;

            background: #fafafa;
        }

        .stop-type {
            font-size: 11px;

            font-weight: bold;

            letter-spacing: 1px;

            color: #777;

            margin-bottom: 5px;
        }

        .stop-icon {
            margin-right: 5px;
        }

        .stop-name {
            font-size: 16px;

            font-weight: bold;

            margin-bottom: 4px;
        }

        .stop-description {
            font-size: 13px;

            color: #666;

            line-height: 1.4;

            margin-bottom: 10px;
        }


        /* =========================================================
           TRAFFIC
           ========================================================= */

        .traffic {
            margin-top: 12px;

            padding: 10px 12px;

            border-radius: 10px;

            background: #f5f5f5;

            font-size: 13px;

            color: #555;
        }


        /* =========================================================
           INPUT
           ========================================================= */

        .input-area {
            display: flex;

            gap: 10px;
        }

        input {
            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #888;
        }

        button {
            padding: 12px 20px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            background: #eeeeee;

            color: #000000;

            font-size: 15px;
        }

        button:hover {
            background: #dddddd;
        }

        button:disabled {
            cursor: not-allowed;

            opacity: 0.6;
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 600px) {

            body {
                margin: 15px auto;
                padding: 10px;
            }

            #chat {
                height: 70vh;
                padding: 12px;
            }

            .trip-route {
                font-size: 19px;
            }

            .day-route {
                font-size: 17px;
            }

            .message {
                max-width: 95%;
            }

            .input-area {
                gap: 6px;
            }

            button {
                padding: 12px 15px;
            }

            .maps-button {
                width: fit-content;
            }

        }

    </style>

</head>


<body>

    <h1>Route Agent Test</h1>


    <div id="chat"></div>


    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Type your message..."
            autocomplete="off"
            onkeydown="handleKey(event)"
        >

        <button
            id="sendButton"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>


    <script>

        /* =========================================================
           STATE
           ========================================================= */

        let conversationId = null;

        let thinkingMessage = null;

        let isSending = false;


        /* =========================================================
           ADD MESSAGE
           ========================================================= */

        function addMessage(
            text,
            sender
        ) {

            const chat =
                document.getElementById(
                    "chat"
                );

            const message =
                document.createElement(
                    "div"
                );

            message.className =
                "message " + sender;

            message.textContent =
                text;

            chat.appendChild(
                message
            );

            chat.scrollTop =
                chat.scrollHeight;
        }


        /* =========================================================
           THINKING
           ========================================================= */

        function showThinking() {

            const chat =
                document.getElementById(
                    "chat"
                );

            if (thinkingMessage) {
                return;
            }

            thinkingMessage =
                document.createElement(
                    "div"
                );

            thinkingMessage.className =
                "message thinking";

            thinkingMessage.innerHTML = `

                <span class="thinking-text">
                    Route Agent is planning
                </span>

                <span class="dots">

                    <span class="dot"></span>

                    <span class="dot"></span>

                    <span class="dot"></span>

                </span>

            `;

            chat.appendChild(
                thinkingMessage
            );

            chat.scrollTop =
                chat.scrollHeight;
        }


        function hideThinking() {

            if (thinkingMessage) {

                thinkingMessage.remove();

                thinkingMessage = null;
            }
        }


        /* =========================================================
           STOP ICONS
           ========================================================= */

        function getStopIcon(
            type
        ) {

            const icons = {

                "LUNCH": "🥘",

                "FUEL": "⛽",

                "WASHROOM": "🚻",

                "OPTIONAL": "⭐",

                "OVERNIGHT": "🛏️",

                "ARRIVAL": "🏁"

            };

            return (
                icons[type]
                || "📍"
            );
        }


        /* =========================================================
           CLEAN TEXT
           ========================================================= */

        function cleanText(
            text
        ) {

            return text
                .replace(
                    /\*\*/g,
                    ""
                )
                .replace(
                    /__/g,
                    ""
                )
                .replace(
                    /^#+\s*/gm,
                    ""
                )
                .trim();
        }


        /* =========================================================
           PARSE TRIP RESPONSE
           ========================================================= */

        function renderTripResponse(
            text
        ) {

            const lines =
                text
                    .split("\n")
                    .map(
                        line =>
                            line.trim()
                    )
                    .filter(
                        line =>
                            line.length > 0
                    );


            let trip = null;

            let days = [];

            let currentDay = null;


            const sectionNames = [

                "TRIP",

                "DAY",

                "LUNCH",

                "FUEL",

                "WASHROOM",

                "OPTIONAL",

                "OVERNIGHT",

                "TRAFFIC",

                "ARRIVAL"

            ];


            for (
                let i = 0;
                i < lines.length;
                i++
            ) {

                const line =
                    cleanText(
                        lines[i]
                    );


                const upperLine =
                    line.toUpperCase();


                /* =================================================
                   TRIP
                   ================================================= */

                if (
                    upperLine === "TRIP"
                ) {

                    trip = {

                        route:
                            cleanText(
                                lines[
                                    i + 1
                                ] || ""
                            ),

                        summary:
                            cleanText(
                                lines[
                                    i + 2
                                ] || ""
                            ),

                        mapsUrl:
                            extractLink(
                                lines[
                                    i + 3
                                ] || ""
                            )

                    };

                    i += 3;

                    continue;
                }


                /* =================================================
                   DAY
                   ================================================= */

                if (
                    /^DAY\s+\d+$/i.test(
                        line
                    )
                ) {

                    currentDay = {

                        number:
                            line.match(
                                /\d+/
                            )[0],

                        route:
                            cleanText(
                                lines[
                                    i + 1
                                ] || ""
                            ),

                        meta:
                            cleanText(
                                lines[
                                    i + 2
                                ] || ""
                            ),

                        stops: [],

                        traffic: null

                    };

                    days.push(
                        currentDay
                    );

                    i += 2;

                    continue;
                }


                /* =================================================
                   STOP TYPES
                   ================================================= */

                if (

                    sectionNames.includes(
                        upperLine
                    )

                    && upperLine !== "TRIP"

                    && upperLine !== "DAY"

                    && upperLine !== "TRAFFIC"

                ) {

                    const type =
                        upperLine;


                    const name =
                        cleanText(
                            lines[
                                i + 1
                            ] || ""
                        );


                    const description =
                        cleanText(
                            lines[
                                i + 2
                            ] || ""
                        );


                    const mapsUrl =
                        extractLink(
                            lines[
                                i + 3
                            ] || ""
                        );


                    if (currentDay) {

                        currentDay.stops.push({

                            type:
                                type,

                            name:
                                name,

                            description:
                                description,

                            mapsUrl:
                                mapsUrl

                        });


                        i += 3;
                    }

                    continue;
                }


                /* =================================================
                   TRAFFIC
                   ================================================= */

                if (
                    upperLine === "TRAFFIC"
                ) {

                    if (currentDay) {

                        currentDay.traffic =
                            cleanText(
                                lines[
                                    i + 1
                                ] || ""
                            );

                        i += 1;
                    }

                    continue;
                }

            }


            /* =====================================================
               FALLBACK
               ===================================================== */

            if (
                !trip ||
                days.length === 0
            ) {

                return createFallbackMessage(
                    text
                );
            }


            /* =====================================================
               MAIN WRAPPER
               ===================================================== */

            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.className =
                "message agent";


            /* =====================================================
               TRIP HEADER
               ===================================================== */

            const tripCard =
                document.createElement(
                    "div"
                );

            tripCard.className =
                "trip-card";


            let tripMapsButton = "";


            if (trip.mapsUrl) {

                tripMapsButton = `

                    <a
                        class="maps-button route-maps-button"
                        href="${escapeHtml(
                            trip.mapsUrl
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        📍 Open route in Google Maps
                    </a>

                `;
            }


            tripCard.innerHTML = `

                <div class="trip-label">
                    YOUR ROAD TRIP
                </div>

                <div class="trip-route">
                    ${escapeHtml(
                        trip.route
                    )}
                </div>

                <div class="trip-summary">
                    ${escapeHtml(
                        trip.summary
                    )}
                </div>

                ${tripMapsButton}

            `;


            wrapper.appendChild(
                tripCard
            );


            /* =====================================================
               DAYS
               ===================================================== */

            days.forEach(
                day => {

                    const dayCard =
                        document.createElement(
                            "div"
                        );

                    dayCard.className =
                        "day-card";


                    let html = `

                        <div class="day-header">

                            <div class="day-number">
                                DAY ${escapeHtml(
                                    day.number
                                )}
                            </div>

                            <div class="day-route">
                                ${escapeHtml(
                                    day.route
                                )}
                            </div>

                            <div class="day-meta">
                                ${escapeHtml(
                                    day.meta
                                )}
                            </div>

                        </div>

                        <div class="timeline">

                    `;


                    /* =================================================
                       STOPS
                       ================================================= */

                    day.stops.forEach(
                        stop => {

                            let mapsButton = "";


                            if (
                                stop.mapsUrl
                            ) {

                                mapsButton = `

                                    <a
                                        class="maps-button"
                                        href="${escapeHtml(
                                            stop.mapsUrl
                                        )}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                    >
                                        📍 Open in Google Maps
                                    </a>

                                `;
                            }


                            html += `

                                <div class="stop">

                                    <div class="stop-dot"></div>

                                    <div class="stop-card">

                                        <div class="stop-type">

                                            <span class="stop-icon">

                                                ${getStopIcon(
                                                    stop.type
                                                )}

                                            </span>

                                            ${escapeHtml(
                                                stop.type
                                            )}

                                        </div>


                                        <div class="stop-name">

                                            ${escapeHtml(
                                                stop.name
                                            )}

                                        </div>


                                        <div class="stop-description">

                                            ${escapeHtml(
                                                stop.description
                                            )}

                                        </div>


                                        ${mapsButton}

                                    </div>

                                </div>

                            `;

                        }
                    );


                    html += `

                        </div>

                    `;


                    /* =================================================
                       TRAFFIC
                       ================================================= */

                    if (
                        day.traffic
                    ) {

                        html += `

                            <div class="traffic">

                                🚦

                                <strong>
                                    Traffic:
                                </strong>

                                ${escapeHtml(
                                    day.traffic
                                )}

                            </div>

                        `;
                    }


                    dayCard.innerHTML =
                        html;


                    wrapper.appendChild(
                        dayCard
                    );

                }
            );


            /* =====================================================
               FINAL SENTENCE
               ===================================================== */

            const lastLines =
                lines.filter(
                    line => {

                        return (

                            line.startsWith(
                                "Want me"
                            )

                            ||

                            line.startsWith(
                                "Would you"
                            )

                        );

                    }
                );


            if (
                lastLines.length > 0
            ) {

                const ending =
                    document.createElement(
                        "div"
                    );

                ending.style.margin =
                    "5px 5px 15px";

                ending.style.color =
                    "#666";

                ending.style.fontSize =
                    "14px";

                ending.textContent =
                    lastLines[
                        lastLines.length - 1
                    ];


                wrapper.appendChild(
                    ending
                );
            }


            return wrapper;
        }


        /* =========================================================
           EXTRACT LINK
           ========================================================= */

        function extractLink(
            line
        ) {

            const cleanLine =
                cleanText(
                    line
                );


            if (
                !cleanLine
            ) {
                return "";
            }


            if (
                !cleanLine
                    .toUpperCase()
                    .startsWith("LINK:")
            ) {

                return "";
            }


            return cleanLine
                .substring(5)
                .trim();
        }


        /* =========================================================
           FALLBACK
           ========================================================= */

        function createFallbackMessage(
            text
        ) {

            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.className =
                "message agent";

            wrapper.textContent =
                text ||
                "I couldn't generate a response.";

            return wrapper;
        }


        /* =========================================================
           ESCAPE HTML
           ========================================================= */

        function escapeHtml(
            text
        ) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                text || "";

            return div.innerHTML;
        }


        /* =========================================================
           ADD AGENT RESPONSE
           ========================================================= */

        function addAgentResponse(
            text
        ) {

            const chat =
                document.getElementById(
                    "chat"
                );


            const rendered =
                renderTripResponse(
                    text || ""
                );


            chat.appendChild(
                rendered
            );


            chat.scrollTop =
                chat.scrollHeight;
        }


        /* =========================================================
           SEND MESSAGE
           ========================================================= */

        async function sendMessage() {

            /* -----------------------------------------
               PREVENT DUPLICATE REQUESTS
               ----------------------------------------- */

            if (
                isSending
            ) {
                return;
            }


            const input =
                document.getElementById(
                    "messageInput"
                );


            const button =
                document.getElementById(
                    "sendButton"
                );


            const message =
                input.value.trim();


            if (
                !message
            ) {
                return;
            }


            isSending = true;


            /* -----------------------------------------
               USER MESSAGE
               ----------------------------------------- */

            addMessage(
                message,
                "user"
            );


            input.value = "";


            /* -----------------------------------------
               THINKING
               ----------------------------------------- */

            showThinking();

            button.disabled = true;


            try {

                const response =
                    await fetch(
                        "http://127.0.0.1:8000/chat",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    message:
                                        message,

                                    conversation_id:
                                        conversationId

                                })

                        }
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        "API request failed: "
                        +
                        response.status
                    );

                }


                const data =
                    await response.json();


                conversationId =
                    data.conversation_id;


                hideThinking();


                /* -----------------------------------------
                   AGENT RESPONSE
                   ----------------------------------------- */

                if (

                    data.reply

                    &&

                    data.reply.trim()

                ) {

                    addAgentResponse(
                        data.reply
                    );

                } else {

                    addMessage(
                        "The agent did not return a response. Please try again.",
                        "agent"
                    );

                }


            } catch (
                error
            ) {

                hideThinking();


                addMessage(
                    "Error connecting to backend: "
                    +
                    error.message,
                    "agent"
                );

            } finally {

                isSending =
                    false;

                button.disabled =
                    false;

                input.focus();

            }
        }


        /* =========================================================
           ENTER KEY
           ========================================================= */

        function handleKey(
            event
        ) {

            if (

                event.key === "Enter"

                &&

                !event.shiftKey

            ) {

                event.preventDefault();


                if (
                    !isSending
                ) {

                    sendMessage();

                }

            }
        }

    </script>

</body>

</html>
